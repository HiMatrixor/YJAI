<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; connect-src https: http: data: blob:; font-src 'self' data:;" />
<title>YJAI 浏览器</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:#12161d;color:#e6edf3;display:flex;flex-direction:column;font-size:13px}
  .toolbar{display:flex;gap:7px;align-items:center;padding:8px 10px;background:#171c24;border-bottom:1px solid #262e3a;flex-wrap:wrap}
  .toolbar .logo{font-weight:700;color:#4f8cff;margin-right:4px;white-space:nowrap}
  .toolbar input[type=text]{flex:1;min-width:140px;padding:7px 10px;background:#0e1116;border:1px solid #313b4a;border-radius:7px;color:#e6edf3;font-size:13px;outline:none}
  .toolbar input[type=text]:focus{border-color:#4f8cff}
  .tb{padding:7px 11px;font-size:13px;background:#1c232e;color:#e6edf3;border:1px solid #313b4a;border-radius:7px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .tb:hover{border-color:#4f8cff}
  .tb.go{background:#4f8cff;color:#fff;border-color:#4f8cff}
  .tb.hint{background:transparent;border-color:transparent;color:#8b98a9;cursor:default}
  .stage{flex:1;position:relative;background:#fff;min-height:0}
  .stage webview{position:absolute;inset:0;width:100%;height:100%}
  .stage .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b98a9;background:#12161d;text-align:center;padding:20px}
  .overlay{position:absolute;inset:0;pointer-events:none;z-index:6}
  .overlay.active{pointer-events:auto;cursor:crosshair;background:rgba(79,140,255,0.07)}
  .overlay .box{position:absolute;border:2px dashed #4f8cff;background:rgba(79,140,255,0.18);display:none;pointer-events:none}
  .overlay .hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#1c232e;border:1px solid #4f8cff;border-radius:8px;padding:7px 16px;font-size:12px;color:#e6edf3;z-index:7;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  .overlay .hint .esc{color:#8b98a9;font-size:11px}
</style>
</head>
<body>
  <div class="toolbar">
    <span class="logo">YJAI</span>
    <button class="tb" id="bk" title="后退">←</button>
    <button class="tb" id="fw" title="前进">→</button>
    <button class="tb" id="rf" title="刷新">⟳</button>
    <input type="text" id="url" placeholder="输入阅卷平台网址，如 dongni100.com" />
    <button class="tb go" id="go">打开</button>
    <button class="tb" id="zoomOut" title="缩小">−</button>
    <span class="tb hint" id="zoomLabel" style="min-width:46px;text-align:center;padding:7px 4px">100%</span>
    <button class="tb" id="zoomIn" title="放大">＋</button>
    <button class="tb" id="zoomReset" title="重置缩放">重置</button>
    <span class="tb hint" id="hintText">Esc 取消框选</span>
  </div>
  <div class="stage" id="stage">
    <div class="empty" id="empty">输入网址并点击「打开」，即可在此独立窗口浏览阅卷平台</div>
    <webview id="wv" src="about:blank" style="visibility:hidden"></webview>
    <div class="overlay" id="overlay">
      <div class="hint" id="hint" style="display:none"></div>
      <div class="box" id="box"></div>
    </div>
  </div>

<script>
const $ = s => document.querySelector(s);
const wv = () => $('#wv');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const UA = {
  edge: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36 Edg/126.0.0.0',
  chrome: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
};
let engine = 'edge';
let action = null;   // null | 'area' | 'input' | 'submit' | 'meta' | 'coord'
let coordTarget = null;   // 坐标拾取的目标 'input' | 'submit'
let pendingId = null;
let drag = null;

function navigate(url){
  if(!url) return;
  if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(url)) url = 'https://' + url;
  const w = wv();
  w.setUserAgent(UA[engine]);
  w.loadURL(url).catch(e=>{});
  $('#empty').style.display = 'none';
  w.style.visibility = 'visible';
}

wv().addEventListener('dom-ready', ()=>{
  $('#empty').style.display = 'none';
  wv().style.visibility = 'visible';
});
wv().addEventListener('did-navigate', e=>{ $('#url').value = e.url; });
wv().addEventListener('did-navigate-in-page', e=>{ $('#url').value = e.url; });

$('#go').onclick = ()=> navigate($('#url').value.trim());
$('#url').addEventListener('keydown', e=>{ if(e.key==='Enter') navigate($('#url').value.trim()); });
$('#bk').onclick = ()=>{ const w=wv(); if(w.canGoBack()) w.goBack(); };
$('#fw').onclick = ()=>{ const w=wv(); if(w.canGoForward()) w.goForward(); };
$('#rf').onclick = ()=>{ wv().reload(); };

/* —— 页面缩放 —— */
let zoom = 1;
function applyZoom(silent){
  zoom = Math.max(0.25, Math.min(3, Math.round(zoom*10)/10));
  wv().setZoomFactor(zoom);
  $('#zoomLabel').textContent = Math.round(zoom*100)+'%';
  if(!silent) toast('缩放 '+Math.round(zoom*100)+'%，若已框选请重新框选答题区域');
}
$('#zoomIn').onclick = ()=>{ zoom += 0.1; applyZoom(); };
$('#zoomOut').onclick = ()=>{ zoom -= 0.1; applyZoom(); };
$('#zoomReset').onclick = ()=>{ zoom = 1; applyZoom(true); };

/* —— 框选 / 拾取 —— */
function startSelect(){
  action = 'area';
  const o = $('#overlay');
  o.classList.add('active'); o.style.cursor = 'crosshair';
  $('#hint').innerHTML = '按住鼠标左键拖动，框选答题区域 <span class="esc">(Esc 取消)</span>';
  $('#hint').style.display = '';
  $('#box').style.display = 'none';
}
function startPick(target){
  action = target;
  const o = $('#overlay');
  o.classList.add('active'); o.style.cursor = 'pointer';
  const label = { input:'分数输入框', submit:'提交按钮', meta:'元数据元素' }[target];
  $('#hint').innerHTML = '请在页面中点击「'+label+'」<span class="esc">(Esc 取消)</span>';
  $('#hint').style.display = '';
}
function startPickCoord(target){
  action = 'coord';
  coordTarget = target;
  const o = $('#overlay');
  o.classList.add('active'); o.style.cursor = 'crosshair';
  const label = { input:'给分点', submit:'提交按钮' }[target] || '目标';
  $('#hint').innerHTML = '请单击「'+label+'」的中心位置 <span class="esc">(Esc 取消)</span>';
  $('#hint').style.display = '';
}
function resetOverlay(){
  action = null; drag = null;
  const o = $('#overlay');
  o.classList.remove('active'); o.style.cursor = '';
  $('#hint').style.display = 'none';
  $('#box').style.display = 'none';
}
function finish(result){
  if(pendingId){ window.YJAI.sendBrowserResult(pendingId, result); pendingId = null; }
  resetOverlay();
}

const overlay = $('#overlay'), box = $('#box');
overlay.addEventListener('mousedown', e=>{
  if(!overlay.classList.contains('active')) return;
  const r = overlay.getBoundingClientRect();
  drag = { sx:e.clientX-r.left, sy:e.clientY-r.top };
  if(action==='area'){
    box.style.display='block';
    box.style.left=drag.sx+'px'; box.style.top=drag.sy+'px';
    box.style.width='0px'; box.style.height='0px';
  }
  e.preventDefault();
});
overlay.addEventListener('mousemove', e=>{
  if(!drag || action!=='area') return;
  const r = overlay.getBoundingClientRect();
  const cx=e.clientX-r.left, cy=e.clientY-r.top;
  box.style.left = Math.min(drag.sx,cx)+'px'; box.style.top = Math.min(drag.sy,cy)+'px';
  box.style.width = Math.abs(cx-drag.sx)+'px'; box.style.height = Math.abs(cy-drag.sy)+'px';
});
overlay.addEventListener('mouseup', async e=>{
  if(!drag) return;
  const r = overlay.getBoundingClientRect();
  const cx=e.clientX-r.left, cy=e.clientY-r.top;
  const dx=Math.abs(cx-drag.sx), dy=Math.abs(cy-drag.sy);
  if(action==='area'){
    const x=Math.min(drag.sx,cx), y=Math.min(drag.sy,cy);
    if(dx<5||dy<5){ toast('框选区域太小'); finish({ cancel:true }); return; }
    const area = { x:Math.round(x), y:Math.round(y), w:Math.round(dx), h:Math.round(dy) };
    finish({ type:'area', area });
  } else if(action==='coord'){
    // 单击拾取：直接用鼠标释放位置，无需拖动阈值判断（鼠标微动不应导致失败）
    const point = { x:Math.round(cx), y:Math.round(cy) };
    // 诊断：命中元素 + 是否在 iframe 内（用于定位坐标/iframe 问题）
    let diag = '';
    try{
      const dcode = `(function(){
        var x=${point.x}, y=${point.y};
        function tagOf(el){
          return el.tagName + (el.id?('#'+el.id):'') + (el.className&&typeof el.className==='string'?('.'+String(el.className).trim().split(/\\s+/).slice(0,2).join('.')):'');
        }
        var depth = 0, path = [], doc = document, cx = x, cy = y;
        while(depth < 8){
          var e = doc.elementFromPoint(cx, cy);
          if(!e){ path.push('NONE'); break; }
          path.push(tagOf(e));
          if(e.tagName==='IFRAME' || e.tagName==='FRAME'){
            var r = e.getBoundingClientRect();
            cx = cx - r.left; cy = cy - r.top;
            try{
              var idoc = e.contentDocument;
              if(idoc){ doc = idoc; depth++; path.push('→iframe内'); continue; }
              path.push('→iframe内(跨域无法穿透)');
            }catch(err){ path.push('→iframe内(跨域无法穿透)'); }
            break;
          }
          break;
        }
        return path.join(' | ');
      })()`;
      diag = await wv().executeJavaScript(dcode);
    }catch(err){ diag = '诊断失败:'+err.message; }
    finish({ type:'coord', target:coordTarget, point, diag });
  } else if(action==='input'||action==='submit'||action==='meta'){
    try{
      const info = await pickAt(Math.round(cx), Math.round(cy));
      if(!info || (!info.selector && !info.iframePick)){ toast('未识别到元素'); finish({ type:'pick', error:'未识别到元素' }); }
      else if(info.iframePick) finish({ type:'pick', target:action, iframePick:true, tag:info.tag, src:info.src, ix:info.ix, iy:info.iy, x:info.x, y:info.y });
      else finish({ type:'pick', target:action, selector:info.selector, tag:info.tag, elementType:info.type });
    }catch(err){ finish({ type:'pick', error:err.message }); }
  }
  drag = null;
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && overlay.classList.contains('active')){
    finish({ cancel:true });
  }
});

async function pickAt(x,y){
  const code = `(function(){
    var x=${x}, y=${y};
    function tagOf(e){ return e.tagName+(e.id?'#'+e.id:'')+(e.className&&typeof e.className==='string'?'.'+String(e.className).trim().split(/\\s+/).slice(0,2).join('.'):''); }
    var el = document.elementFromPoint(x, y);
    if(!el) return null;
    // 跨域 iframe：记录 iframe 内局部坐标，交由 CDP 处理（顶层 querySelector 无法到达）
    if(el.tagName==='IFRAME' || el.tagName==='FRAME'){
      var r = el.getBoundingClientRect();
      return { iframePick:true, tag: tagOf(el), src: el.src||'', ix: Math.round(x-r.left), iy: Math.round(y-r.top), x: Math.round(x), y: Math.round(y) };
    }
    var TARGETS = ['INPUT','TEXTAREA','SELECT','BUTTON','A'];
    var cur = el;
    while(cur && TARGETS.indexOf(cur.tagName) === -1) cur = cur.parentElement;
    if(!cur) cur = el;
    if(cur.tagName === 'LABEL'){
      var inner = cur.querySelector('input, textarea, select');
      if(inner) cur = inner;
      else if(cur.htmlFor){ var byId = document.getElementById(cur.htmlFor); if(byId) cur = byId; }
    }
    function build(n){
      if(n.id) return '#' + CSS.escape(n.id);
      var sel = n.tagName.toLowerCase();
      if(n.className && typeof n.className === 'string'){
        var cls = n.className.trim().split(/\\s+/).filter(Boolean).slice(0,2);
        if(cls.length) sel += '.' + cls.map(function(c){return CSS.escape(c);}).join('.');
      }
      return sel;
    }
    return { selector: build(cur), tag: cur.tagName, id: cur.id||'', type: cur.type||'' };
  })()`;
  return await wv().executeJavaScript(code);
}

function toast(msg){
  let t = document.getElementById('btoast');
  if(!t){ t = document.createElement('div'); t.id='btoast'; t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1c232e;border:1px solid #313b4a;border-radius:8px;padding:9px 18px;font-size:13px;z-index:99;transition:.2s;opacity:0'; document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._t); t._t = setTimeout(()=>t.style.opacity='0', 2200);
}

/* —— 接收主窗口的动作 —— */
window.YJAI.onBrowserAction(async (msg)=>{
  const { id, action:act, data } = msg;
  switch(act){
    case 'navigate':
      navigate(data);
      finishId(id, { ok:true });
      break;
    case 'set-ua':
      engine = data || 'edge';
      wv().setUserAgent(UA[engine]);
      if(wv().getURL() && wv().getURL()!=='about:blank') wv().reload();
      finishId(id, { ok:true });
      break;
    case 'get-url':
      finishId(id, { url: wv().getURL() || '' });
      break;
    case 'execute': {
      try{
        const r = await wv().executeJavaScript(data);
        finishId(id, { result: r });
      }catch(e){ finishId(id, { error:'执行失败: '+e.message }); }
      break;
    }
    case 'start-select':
      pendingId = id;
      startSelect();
      break;
    case 'start-pick':
      pendingId = id;
      startPick(data);
      break;
    case 'start-pick-coord':
      pendingId = id;
      startPickCoord(data);
      break;
    case 'capture': {
      try{
        const a = data; // {x,y,w,h}
        const img = await wv().capturePage({ x:a.x, y:a.y, width:a.w, height:a.h });
        finishId(id, { dataUrl: img.toDataURL() });
      }catch(e){ finishId(id, { error:'截图失败: '+e.message }); }
      break;
    }
    case 'fill-score': {
      const { selector, score } = data;
      const code = `(function(){
        var el = document.querySelector(${JSON.stringify(selector)});
        if(!el) return 'NOT_FOUND';
        if(el.tagName!=='INPUT' && el.tagName!=='TEXTAREA'){
          var inner = el.querySelector('input, textarea');
          if(inner) el = inner;
          else return 'NOT_INPUT';
        }
        el.focus();
        var proto = (el.tagName==='TEXTAREA') ? HTMLTextAreaElement.prototype : HTMLInputElement.prototype;
        var setter = Object.getOwnPropertyDescriptor(proto, 'value').set;
        var v = ${JSON.stringify(String(score))};
        if(setter) setter.call(el, v); else el.value = v;
        try{ el.dispatchEvent(new InputEvent('input', {bubbles:true, inputType:'insertText', data:v})); }
        catch(e){ el.dispatchEvent(new Event('input', {bubbles:true})); }
        el.dispatchEvent(new Event('change', {bubbles:true}));
        return 'OK';
      })()`;
      const r = await wv().executeJavaScript(code);
      finishId(id, { ok: r==='OK', result: r });
      break;
    }
    case 'fill-score-coord': {
      // 坐标式填分（连点累加 + 穿透 iframe）：e卷通等平台点击给分点每次累加分值
      // 递归穿透 iframe（同源），在 iframe 内部文档派发完整事件序列（pointer+mouse+click）
      // 跨域 iframe 无法穿透时回退 CDP Input.dispatchMouseEvent（浏览器级输入可命中 iframe 内部）
      // data = { x, y, times }
      try{
        const { x, y, times } = data || {};
        if(x==null || y==null){ finishId(id, { error:'缺少坐标' }); break; }
        const n = Math.max(1, Math.round(Number(times) || 0));
        const code = `(function(){
          var x=${x}, y=${y}, n=${n};
          function tagOf(el){
            if(!el) return 'NONE';
            return el.tagName + (el.id?('#'+el.id):'') + (el.className&&typeof el.className==='string'?('.'+String(el.className).trim().split(/\\s+/).slice(0,2).join('.')):'');
          }
          function descend(doc, cx, cy, depth){
            var el = doc.elementFromPoint(cx, cy);
            if(!el) return {hit:'NONE', cross:false};
            if((el.tagName==='IFRAME' || el.tagName==='FRAME') && depth < 8){
              var r = el.getBoundingClientRect();
              var ix = cx - r.left, iy = cy - r.top;
              var idoc = null;
              try{ idoc = el.contentDocument; }catch(e){}
              // 跨域 iframe：Chrome 访问 contentDocument 返回 null（不抛异常），必须按 null 判定
              if(idoc && el.contentWindow){
                var inner = descend(idoc, ix, iy, depth+1);
                if(inner) return inner;
                return {hit:tagOf(el), cross:true, ix:Math.round(ix), iy:Math.round(iy), src:el.src||''};
              }
              return {hit:tagOf(el), cross:true, ix:Math.round(ix), iy:Math.round(iy), src:el.src||''};
            }
            return {hit:tagOf(el), cross:false};
          }
          function clickOnce(){
            var t = descend(document, x, y, 0);
            if(!t || t.hit === 'NONE') return null;
            // 仅当确定同源可穿透时才在页面内派发合成事件；跨域一律交由 CDP 处理
            if(t.cross) return t;
            var el = document.elementFromPoint(x, y) || document.body;
            var cw = window;
            var base = {bubbles:true, cancelable:true, view:cw, clientX:x, clientY:y, screenX:x, screenY:y};
            if(cw.PointerEvent){
              try{ el.dispatchEvent(new cw.PointerEvent('pointerover', Object.assign({}, base, {pointerId:1, pointerType:'mouse', isPrimary:true}))); }catch(e){}
              try{ el.dispatchEvent(new cw.PointerEvent('pointerdown', Object.assign({}, base, {pointerId:1, pointerType:'mouse', isPrimary:true, button:0, buttons:1}))); }catch(e){}
              try{ el.dispatchEvent(new cw.PointerEvent('pointerup', Object.assign({}, base, {pointerId:1, pointerType:'mouse', isPrimary:true, button:0, buttons:0}))); }catch(e){}
            }
            try{ el.dispatchEvent(new cw.MouseEvent('mousedown', Object.assign({}, base, {button:0, buttons:1}))); }catch(e){}
            try{ el.dispatchEvent(new cw.MouseEvent('mouseup', Object.assign({}, base, {button:0, buttons:0}))); }catch(e){}
            try{ el.dispatchEvent(new cw.MouseEvent('click', Object.assign({}, base, {button:0}))); }catch(e){}
            return t;
          }
          var first = clickOnce();
          var lastHit = first ? first.hit : 'NONE';
          var cross = first ? !!first.cross : false;
          var i = 1;
          while(i < n){
            var t2 = clickOnce();
            if(t2 && t2.hit) lastHit = t2.hit;
            if(t2 && t2.cross) cross = true;
            i++;
            // 同步等待无法 sleep，用 busy 循环近似节流（在页面内阻塞 200ms）
            var end = Date.now() + 200;
            while(Date.now() < end){ /* 节流 */ }
          }
          return JSON.stringify({clicked:n, hit:lastHit, cross:cross});
        })()`;
        let r = await wv().executeJavaScript(code);
        let info = {};
        try{ info = (typeof r === 'string') ? JSON.parse(r) : (r || {}); }catch(e){ info = {}; }
        // 跨域 iframe：合成事件穿不进去，回退 CDP（浏览器级输入，等效真实点击，可命中 iframe 内部）
        if(!info.clicked || info.cross === true || String(info.hit||'').toUpperCase().startsWith('IFRAME')){
          const cr = await window.YJAI.cdpClick({ x, y, times: n });
          if(cr && cr.error){ finishId(id, { ok:false, result:info, error:'CDP 回退失败: '+cr.error }); break; }
          finishId(id, { ok:true, result:{ clicked:(cr&&cr.clicked)||n, hit:info.hit||'IFRAME', mode:'cdp', target:(cr&&cr.target)||'', iframeHit:(cr&&cr.iframeHit)||'', local:(cr&&cr.local)||null } });
          break;
        }
        finishId(id, { ok: !!(info.clicked), result: info });
      }catch(e){ finishId(id, { error:'坐标填分失败: '+e.message }); }
      break;
    }
    case 'click-coord': {
      // 坐标点击（穿透 iframe + CDP 回退）：data = { x, y }
      try{
        const { x, y } = data || {};
        const code = `(function(){
          var x=${x}, y=${y};
          function tagOf(el){
            if(!el) return 'NONE';
            return el.tagName + (el.id?('#'+el.id):'') + (el.className&&typeof el.className==='string'?('.'+String(el.className).trim().split(/\\s+/).slice(0,2).join('.')):'');
          }
          function descend(doc, cx, cy, depth){
            var el = doc.elementFromPoint(cx, cy);
            if(!el) return {hit:'NONE', cross:false};
            if((el.tagName==='IFRAME' || el.tagName==='FRAME') && depth < 8){
              var r = el.getBoundingClientRect();
              var ix = cx - r.left, iy = cy - r.top;
              var idoc = null;
              try{ idoc = el.contentDocument; }catch(e){}
              // 跨域 iframe：Chrome 访问 contentDocument 返回 null（不抛异常），必须按 null 判定
              if(idoc && el.contentWindow){
                var inner = descend(idoc, ix, iy, depth+1);
                if(inner) return inner;
              }
              return {hit:tagOf(el), cross:true, ix:Math.round(ix), iy:Math.round(iy), src:el.src||''};
            }
            return {hit:tagOf(el), cross:false};
          }
          var t = descend(document, x, y, 0);
          if(!t || t.hit === 'NONE') return JSON.stringify({hit:'NONE', cross:false});
          // 跨域 iframe：不在页面内派发（穿不进去），直接交由 CDP
          if(t.cross) return JSON.stringify({hit:t.hit, cross:true});
          var el = document.elementFromPoint(x, y) || document.body;
          var base = {bubbles:true, cancelable:true, view:window, clientX:x, clientY:y, screenX:x, screenY:y};
          if(window.PointerEvent){
            try{ el.dispatchEvent(new PointerEvent('pointerover', Object.assign({}, base, {pointerId:1, pointerType:'mouse', isPrimary:true}))); }catch(e){}
            try{ el.dispatchEvent(new PointerEvent('pointerdown', Object.assign({}, base, {pointerId:1, pointerType:'mouse', isPrimary:true, button:0, buttons:1}))); }catch(e){}
            try{ el.dispatchEvent(new PointerEvent('pointerup', Object.assign({}, base, {pointerId:1, pointerType:'mouse', isPrimary:true, button:0, buttons:0}))); }catch(e){}
          }
          try{ el.dispatchEvent(new MouseEvent('mousedown', Object.assign({}, base, {button:0, buttons:1}))); }catch(e){}
          try{ el.dispatchEvent(new MouseEvent('mouseup', Object.assign({}, base, {button:0, buttons:0}))); }catch(e){}
          try{ el.dispatchEvent(new MouseEvent('click', Object.assign({}, base, {button:0}))); }catch(e){}
          return JSON.stringify({hit:t.hit, cross:!!t.cross});
        })()`;
        const raw = await wv().executeJavaScript(code);
        let r = {};
        try{ r = (typeof raw === 'string') ? JSON.parse(raw) : (raw || {}); }catch(e){ r = {}; }
        const hitStr = String(r.hit || '');
        const cross = r.cross === true;
        if(cross || hitStr.toUpperCase().startsWith('IFRAME') || hitStr === 'NONE'){
          const cr = await window.YJAI.cdpClick({ x, y, times: 1 });
          if(cr && cr.error){ finishId(id, { ok:false, result:r, error:'CDP 回退失败: '+cr.error }); break; }
          finishId(id, { ok:true, result:{ hit:hitStr||'IFRAME', mode:'cdp', target:(cr&&cr.target)||'', iframeHit:(cr&&cr.iframeHit)||'', local:(cr&&cr.local)||null } });
          break;
        }
        finishId(id, { ok:true, result:r });
      }catch(e){ finishId(id, { error:'坐标点击失败: '+e.message }); }
      break;
    }
    case 'click-submit': {
      try {
        // 先定位元素中心
        const code = `(function(){
          var el = document.querySelector(${JSON.stringify(data||'')});
          if(!el) return null;
          var r = el.getBoundingClientRect();
          if(r.width<1||r.height<1) return null;
          return { x: Math.round(r.left + r.width/2), y: Math.round(r.top + r.height/2), tag: el.tagName };
        })()`;
        const pos = await wv().executeJavaScript(code);
        if(!pos || pos.x==null){ finishId(id, { ok:false, result:'NOT_FOUND' }); break; }
        // 用 CDP 真实点击（isTrusted=true，React 组件必响应）
        let viaCdp = false;
        try{
          const cr = await window.YJAI.cdpClick({ x:pos.x, y:pos.y, times:1 });
          if(cr && !cr.error) viaCdp = true;
          else if(cr && cr.error) finishId(id, { ok:false, error:'CDP 点击失败: '+cr.error });
        }catch(e){ /* 回退合成事件 */ }
        if(viaCdp){ finishId(id, { ok:true, result:'OK', via:'cdp', pos:pos }); break; }
        // 回退：合成鼠标事件序列（含 pointer 事件，兼容性更好）
        const r2 = await wv().executeJavaScript(`(function(){
          var el = document.querySelector(${JSON.stringify(data||'')});
          if(!el) return 'NOT_FOUND';
          var rect = el.getBoundingClientRect();
          var x = rect.left + rect.width/2, y = rect.top + rect.height/2;
          var o = {bubbles:true, cancelable:true, view:window, clientX:x, clientY:y, button:0};
          try{ el.dispatchEvent(new PointerEvent('pointerdown', o)); }catch(e){}
          el.dispatchEvent(new MouseEvent('mousedown', o));
          try{ el.dispatchEvent(new PointerEvent('pointerup', o)); }catch(e){}
          el.dispatchEvent(new MouseEvent('mouseup', o));
          el.dispatchEvent(new MouseEvent('click', o));
          return 'OK';
        })()`);
        finishId(id, { ok: r2==='OK', result: r2, via:'synthetic' });
      } catch(e){ finishId(id, { error:'提交点击失败: '+e.message }); }
      break;
    }
    case 'dump-dom': {
      // 诊断：输出页面中可能的输入框/按钮/给分元素（含位置尺寸），用于适配未知平台结构
      try {
        const code = `(function(){
          var out = [];
          var all = document.querySelectorAll('*');
          for(var i=0;i<all.length && out.length<120;i++){
            var el = all[i];
            if(!el.tagName) continue;
            var tag = el.tagName;
            var cls = (el.className && typeof el.className==='string') ? el.className.trim() : '';
            var txt = (el.textContent||'').replace(/\\s+/g,' ').trim().slice(0,20);
            var cand = /^(INPUT|BUTTON|SELECT|TEXTAREA)$/.test(tag)
              || /(score|submit|btn|button|mark|point|fen|grade|input|num|key)/i.test(cls)
              || /(提交|给分|得分|评分|确认|保存|满分|下一步)/.test(txt);
            if(!cand) continue;
            var rc = el.getBoundingClientRect();
            if(rc.width<4 || rc.height<4) continue;
            out.push(tag + (el.id?'#'+el.id:'') + (cls?'.'+cls.split(/\\s+/).slice(0,2).join('.'):'')
              + ' ['+Math.round(rc.left)+','+Math.round(rc.top)+' '+Math.round(rc.width)+'x'+Math.round(rc.height)+']'
              + (txt?' "'+txt+'"':''));
          }
          // iframe 情况一并说明
          var ifs = document.querySelectorAll('iframe');
          var iinfo = '';
          if(ifs.length){
            iinfo = '\\n--- iframe('+ifs.length+') ---\\n';
            for(var j=0;j<ifs.length;j++){
              var f = ifs[j], fr = f.getBoundingClientRect();
              iinfo += 'IFRAME '+(f.id?'#'+f.id:'')+' src='+(f.src||'').slice(0,120)+' ['+Math.round(fr.left)+','+Math.round(fr.top)+' '+Math.round(fr.width)+'x'+Math.round(fr.height)+']\\n';
            }
          }
          return (out.length? out.join('\\n') : '（未找到候选元素）') + iinfo;
        })()`;
        const r = await wv().executeJavaScript(code);
        finishId(id, { result: r });
      } catch(e) { finishId(id, { error:'诊断失败: '+e.message }); }
      break;
    }
    case 'auto-detect': {
      // 自动识别平台元素：按类名/文字定位分数输入框与提交按钮（适配 ls.xiaoxianai.cn 等 React 平台）
      try {
        const code = `(function(){
          function vis(el){
            if(!el) return false;
            var r = el.getBoundingClientRect();
            return r.width>4 && r.height>4 && r.top>=-5 && r.left>=-5;
          }
          function clsOf(el){
            return (el.className && typeof el.className==='string') ? el.className.trim().split(/\\s+/) : [];
          }
          function selOf(el){
            if(!el) return null;
            if(el.id) return '#'+CSS.escape(el.id);
            var cs = clsOf(el);
            for(var i=0;i<cs.length;i++){
              if(/scoreInput/i.test(cs[i])) return el.tagName.toLowerCase()+'[class*="scoreInput"]';
            }
            if(cs.length) return el.tagName.toLowerCase()+'.'+CSS.escape(cs[0]);
            return el.tagName.toLowerCase();
          }
          // 1) 分数输入框：优先类名含 scoreInput 的可见 input
          var scoreEl = null;
          var si = document.querySelectorAll('input[class*="scoreInput"]');
          for(var a=0;a<si.length;a++){ if(vis(si[a])){ scoreEl = si[a]; break; } }
          if(!scoreEl){
            var all = document.querySelectorAll('input');
            for(var b=0;b<all.length;b++){
              var ty = (all[b].type||'text').toLowerCase();
              if((ty==='text'||ty==='number'||ty==='') && vis(all[b])){ scoreEl = all[b]; break; }
            }
          }
          // 2) 提交按钮：文字精确为「提交」的可见元素（排除包含「提交上一题下一题」的容器）
          var submitEl = null;
          var cands = document.querySelectorAll('div,button,a,span');
          for(var c=0;c<cands.length;c++){
            var t = (cands[c].textContent||'').replace(/\\s+/g,'');
            if(t==='提交' && vis(cands[c])){ submitEl = cands[c]; break; }
          }
          // 3) 自动提交复选框
          var autoEl = null;
          var wrap = document.querySelectorAll('div');
          for(var d=0;d<wrap.length;d++){
            var wt = (wrap[d].textContent||'').replace(/\\s+/g,'');
            if(wt.indexOf('自动提交')>=0 && wt.length<20){
              var cb = wrap[d].querySelector('input[type=checkbox]');
              if(cb){ autoEl = cb; break; }
            }
          }
          return {
            scoreInput: selOf(scoreEl),
            submitBtn: selOf(submitEl),
            autoSubmit: !!autoEl,
            autoSubmitChecked: autoEl ? !!autoEl.checked : null,
            hint: 'score='+(scoreEl?scoreEl.tagName+'.'+clsOf(scoreEl).slice(0,1).join(''):'未找到')+' submit='+(submitEl?submitEl.tagName+'.'+clsOf(submitEl).slice(0,1).join(''):'未找到')
          };
        })()`;
        const r = await wv().executeJavaScript(code);
        finishId(id, { result: r });
      } catch(e) { finishId(id, { error:'自动识别失败: '+e.message }); }
      break;
    }
    default:
      finishId(id, { error:'未知动作 '+act });
  }
});

window.YJAI.onNavigate((url)=>{
  navigate(url);
});

function finishId(id, result){
  if(id) window.YJAI.sendBrowserResult(id, result);
}
</script>
